name: Product validation
on:
  pull_request: {}
  push:
    branches:
      - main
      - 'fix/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))"
      - run: npm test
      - run: npm run build
      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.0
      - run: supabase start
      - run: supabase test db
